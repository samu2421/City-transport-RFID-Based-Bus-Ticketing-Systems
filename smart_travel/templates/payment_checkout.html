<!DOCTYPE html>
<html lang="en">
{% include "header.html" %}
<body>
<main id="main">
    <!-- ======= Breadcrumbs ======= -->
    <section class="breadcrumbs">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <h2>Pay fare</h2>
                <ol>
                    <li><a href="{{ url_for('profile') }}">Profile</a></li>
                    <li>Pay fare</li>
                </ol>
            </div>
        </div>
    </section><!-- End Breadcrumbs -->

    <div class="payment-card card mb-4 rounded-3 shadow-sm">
        <div class="card-body">
            <h1 class="card-title pricing-card-title">{{ order['amount']/100 }} Rs.</h1>
            <hr>
            <ul class="list-unstyled mt-3 mb-4">
                <li>From: {{ start_station }} To: {{ end_station }}</li>
                <li>Distance travelled: {{ trip.distance }} Km.</li>
                <li>Order Id: {{ order['id'] }}</li>
            </ul>
            <button id="rzp-button1" class="btn btn-primary">Pay with Razorpay</button>
            <a class="btn btn-outline-secondary" href="{{ url_for('profile') }}">Cancel</a>
        </div>
    </div>

    <!-- Razorpay returns these values to the server, which verifies the signature before settling the trip -->
    <form id="payment-verify-form" action="{{ url_for('verify_payment') }}" method="post">
        <input type="hidden" name="razorpay_payment_id">
        <input type="hidden" name="razorpay_order_id">
        <input type="hidden" name="razorpay_signature">
    </form>
</main>
</body>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    var options = {
        "key": {{ razor_key|tojson }},
        "amount": {{ order['amount']|tojson }},
        "currency": "INR",
        "name": "Smart Travel",
        "description": "Bus fare",
        "order_id": {{ order['id']|tojson }},
        "prefill": {
            "name": {{ current_user.name|tojson }},
            "email": {{ current_user.email|tojson }}
        },
        "handler": function (response) {
            var form = document.getElementById('payment-verify-form');
            form.razorpay_payment_id.value = response.razorpay_payment_id;
            form.razorpay_order_id.value = response.razorpay_order_id;
            form.razorpay_signature.value = response.razorpay_signature;
            form.submit();
        },
        "theme": {
            "color": "#3399cc"
        }
    };
    var rzp1 = new Razorpay(options);
    rzp1.on('payment.failed', function (response) {
        alert("Payment failed: " + response.error.description);
    });
    document.getElementById('rzp-button1').onclick = function (e) {
        rzp1.open();
        e.preventDefault();
    };
</script>
{% include "footer.html" %}
</html>
