<!-- ======= Header ======= -->
<header id="header" class="fixed-top ">
    <div class="container d-flex align-items-center justify-content-between">

        <h1 class="logo"><a href="{{ url_for('home') }}">Travel</a></h1>

        <nav id="navbar" class="navbar">
            <ul>
                <li><a class="nav-link scrollto active" href="{{ url_for('home') }}">Home</a></li>
                <li><a class="nav-link scrollto" href="{{ url_for('about') }}">About us</a></li>
                {% if not current_user.is_authenticated: %}
                <li><a class="nav-link scrollto" href="{{ url_for('login') }}">Log In</a></li>
                <li><a class="getstarted scrollto" href="{{ url_for('register') }}">Get Started</a></li>
                {% else: %}
                {% if current_user.id == admin_user_id %}
                <li><a class="nav-link scrollto" href="{{ url_for('admin') }}">Admin</a></li>
                {% endif %}
                <li><a class="nav-link scrollto" href="{{ url_for('profile') }}">Profile</a></li>
                <li><a class="nav-link scrollto" href="{{ url_for('logout') }}">Log Out</a></li>
                {% endif %}
            </ul>
            <i class="bi bi-list mobile-nav-toggle"></i>
        </nav><!-- .navbar -->

    </div>
</header><!-- End Header -->
